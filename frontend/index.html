<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Collaborative Task Management</title>
    <meta name="description" content="Manage projects, assign tasks, and track progress with your team in real-time.">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="glass" style="margin: 1rem 2rem; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 100;">

            <div style="width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: grid; place-items: center;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </div>
            <h2 class="text-gradient">TaskFlow</h2>
        </div>
        <div id="nav-user" style="display: flex; gap: 1rem; align-items: center;">
            <!-- Dynamic Nav -->
        </div>
    </nav>

    <div id="app">
        <!-- Dynamic Content -->
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
